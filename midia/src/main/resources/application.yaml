spring:
  application:
    name: midia

  datasource:
    url: jdbc:postgresql://localhost:5434/trilha_midia
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Dev: Hibernate cria/atualiza tabelas. Producao: trocar para 'validate'
      # e gerar o baseline do schema via Flyway.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Resource server: o front sobe arquivo direto aqui, entao validar o Bearer e essencial.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8080/oauth2/jwks}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

minio:
  # Endereco INTERNO do storage (so o servico fala com ele; o bucket e privado).
  # Em prod vem do compose como http://minio:9000.
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: trilha-midia

midia:
  # Base PUBLICA deste servico — e com ela que a URL do binario e montada
  # (${midia.public-url}/arquivo/{id}/conteudo). Precisa ser o endereco que o
  # browser/app alcanca: em dev o proprio localhost:8083; em prod o dominio da
  # API, que o reverse proxy roteia para ca.
  public-url: ${MIDIA_PUBLIC_URL:http://localhost:8083}

  # Travas de abuso do upload. O binario vem direto do front, sem passar pelo
  # BFF — portanto sem o rate limit por IP da borda. Estes limites impedem que
  # uma conta autenticada encha o disco da maquina.
  upload:
    max-por-hora: ${UPLOAD_MAX_POR_HORA:60}
    cota-mb: ${UPLOAD_COTA_MB:2048}

# Origens liberadas no CORS (o front web sobe arquivo direto aqui, fora do BFF).
# Dev: localhost. Em prod, defina CORS_ALLOWED_ORIGINS com o dominio real.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server:
  port: 8083

# traceId (correlacao de requisicoes) recebido da borda no header X-Trace-Id.
logging:
  pattern:
    level: "%5p [trace:%X{traceId:-}]"
