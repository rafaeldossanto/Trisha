name: Deploy

# DORMENTE: so roda com clique manual (workflow_dispatch) e falha com
# instrucao clara enquanto os secrets da VPS nao existirem.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   VPS_HOST     - IP ou hostname da VPS
#   VPS_USER     - usuario SSH (ex.: deploy)
#   VPS_SSH_KEY  - chave privada SSH (conteudo do PEM, sem passphrase)
#
# So deploya a main: producao nunca sai da dev.
#
# ANTES DE SUBIR QUALQUER COISA o workflow confere o CI de cada servico alvo
# (step "Confere o CI dos servicos alvo"). Sem isso o deploy mentia: quando o CI
# quebra, o job que publica a imagem nao roda, a tag :latest continua apontando
# para o commit anterior e o 'compose pull' re-subia a versao velha com o
# workflow verde — parecia que a correcao tinha ido para producao.

on:
  workflow_dispatch:
    inputs:
      servico:
        description: "Servico a atualizar (ou 'todos')"
        required: true
        default: todos
        type: choice
        options: [todos, cadastro, app, loc, midia, bff, caddy]

permissions:
  contents: read
  # O guard le os runs de CI deste mesmo repo. No monorepo o GITHUB_TOKEN
  # basta — antes cada servico era um repo e a consulta tinha que ser anonima.
  actions: read

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    steps:
      - name: So a main vai para producao
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy disparado a partir de '${{ github.ref_name }}'. Producao so sai da main — rode o workflow escolhendo a branch main."
          exit 1

      - name: Confere se os secrets da VPS existem
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Secrets da VPS nao configurados. Crie VPS_HOST, VPS_USER e VPS_SSH_KEY em Settings > Secrets para ativar o deploy."
            exit 1
          fi

      # Historico completo: o guard compara o commit do ultimo CI de cada
      # servico com o HEAD da main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se o CI de algum servico nao passou, o job morre aqui e nada — nem o
      # compose — chega perto da VPS.
      - name: Confere o CI dos servicos alvo
        shell: bash
        env:
          SERVICO: ${{ inputs.servico }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem 'set -e' de proposito: quando o alvo e 'todos', queremos listar
          # TODOS os servicos reprovados de uma vez, e nao morrer no primeiro.
          set -uo pipefail

          # Servico do compose -> pasta no monorepo. O workflow de CI de cada um
          # e .github/workflows/<servico>.yml, que publica a imagem pelo
          # _java-service.yml.
          declare -A PASTAS=(
            [cadastro]=Cadastro
            [app]=APP
            [bff]=bff
            [loc]=loc
            [midia]=midia
          )
          # Imagens de terceiro: nao tem CI nosso para conferir.
          declare -A EXTERNAS=(
            [caddy]=caddy:2-alpine
          )

          REGISTRO="$RUNNER_TEMP/deploy-shas.txt"
          : > "$REGISTRO"

          if [ "$SERVICO" = "todos" ]; then
            ALVOS="cadastro app loc midia bff"
          else
            ALVOS="$SERVICO"
          fi

          head_sha=$(git rev-parse HEAD)
          curto="${head_sha:0:7}"

          falhou=0
          for svc in $ALVOS; do
            imagem_externa="${EXTERNAS[$svc]:-}"
            if [ -n "$imagem_externa" ]; then
              echo "-- $svc: imagem de terceiro ($imagem_externa), sem CI para conferir."
              echo "$svc|-|$imagem_externa" >> "$REGISTRO"
              continue
            fi

            pasta="${PASTAS[$svc]:-}"
            if [ -z "$pasta" ]; then
              echo "::error::Servico '$svc' nao esta no mapa de pastas deste workflow."
              falhou=1
              continue
            fi
            workflow="$svc.yml"

            # event=push porque so o run de push publica imagem: o job
            # docker-image do _java-service.yml tem 'if: github.event_name == push'.
            # Um run de workflow_dispatch pode estar verde sem ter publicado nada.
            erro_api="$RUNNER_TEMP/gh-erro.txt"
            if ! run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=1" \
                         --jq '.workflow_runs[0] // empty' 2>"$erro_api"); then
              echo "::error::Nao foi possivel consultar o CI de $pasta ($workflow): $(cat "$erro_api"). Na duvida o deploy e bloqueado."
              falhou=1
              continue
            fi
            if [ -z "$run" ]; then
              echo "::error::CI de $pasta: nenhum run de push do $workflow na main. A imagem :latest nao pode ser confirmada — deploy bloqueado."
              falhou=1
              continue
            fi

            run_sha=$(jq -r '.head_sha // empty' <<<"$run")
            status=$(jq -r '.status // empty' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            url=$(jq -r '.html_url // empty' <<<"$run")

            # Com o filtro de paths, o CI do servico so roda quando a pasta dele
            # muda: o ultimo run pode ser de um commit anterior ao HEAD e mesmo
            # assim ser a :latest certa. O que importa e nada do servico ter
            # mudado depois dele.
            if ! git cat-file -e "$run_sha^{commit}" 2>/dev/null; then
              echo "::error::CI de $pasta: o commit do ultimo run (${run_sha:0:7}) nao esta no historico da main. Deploy bloqueado."
              falhou=1
              continue
            fi
            if ! git diff --quiet "$run_sha" "$head_sha" -- "$pasta" ".github/workflows/$workflow" .github/workflows/_java-service.yml; then
              echo "::error::$pasta mudou depois do ultimo CI (run em ${run_sha:0:7}, main em $curto). A :latest ainda nao tem essas mudancas — espere o $workflow rodar."
              falhou=1
              continue
            fi
            if [ "$status" != "completed" ]; then
              echo "::error::CI de $pasta ainda esta rodando no commit ${run_sha:0:7} (status: $status). Espere terminar: $url"
              falhou=1
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::CI de $pasta QUEBROU no commit ${run_sha:0:7} (conclusao: $conclusion). A imagem :latest ainda e a do commit ANTERIOR — deployar agora nao subiria esta versao. Corrija o CI antes: $url"
              falhou=1
              continue
            fi

            echo "OK -- $svc ($pasta) imagem do commit ${run_sha:0:7}"
            echo "$svc|$pasta|$run_sha" >> "$REGISTRO"
          done

          if [ "$falhou" -ne 0 ]; then
            echo "::error::Deploy bloqueado pelo guard de CI. Nada foi enviado para a VPS."
            exit 1
          fi

      # strip_components tira o 'trilha-infra/' do caminho: na VPS os arquivos
      # continuam direto em ~/trilha, como antes do monorepo.
      - name: Copia compose e configs para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "trilha-infra/docker-compose.prod.yml,trilha-infra/Caddyfile,trilha-infra/postgres-init/*,trilha-infra/mosquitto/mosquitto.conf,trilha-infra/mosquitto/acl.example"
          # mosquitto.dev.conf e docker-compose.dev.yml ficam de fora: sao locais.
          target: ~/trilha
          strip_components: 1

      - name: Pull e sobe os containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/trilha
            if [ ! -f .env ]; then
              echo "ERRO: crie o ~/trilha/.env na VPS a partir do .env.example antes do primeiro deploy."
              exit 1
            fi
            SERVICO="${{ inputs.servico }}"
            if [ "$SERVICO" = "todos" ]; then
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
            else
              docker compose -f docker-compose.prod.yml pull "$SERVICO"
              docker compose -f docker-compose.prod.yml up -d "$SERVICO"
            fi
            docker image prune -f
            # Fica no log do run: o que a VPS de fato tem, com os digests.
            # '|| true' para um erro aqui nao marcar como falho um deploy que deu certo.
            docker compose -f docker-compose.prod.yml images || true

      # O guard acima resolveu, para cada servico, o commit cuja imagem :latest
      # foi puxada. Este resumo e o unico registro de qual versao esta em
      # producao — o compose so diz ':latest'.
      - name: Resumo do deploy
        if: success()
        shell: bash
        env:
          SERVICO: ${{ inputs.servico }}
        run: |
          set -uo pipefail
          REGISTRO="$RUNNER_TEMP/deploy-shas.txt"
          {
            echo "## Deploy concluido — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Alvo do workflow: \`$SERVICO\`"
            echo
            echo "| Servico | Commit da imagem | Pasta |"
            echo "|---|---|---|"
            while IFS='|' read -r svc pasta sha; do
              [ -z "${svc:-}" ] && continue
              if [ "$pasta" = "-" ]; then
                echo "| $svc | — | \`$sha\` (imagem de terceiro) |"
              else
                echo "| $svc | [\`${sha:0:7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$sha) | \`$pasta/\` |"
              fi
            done < "$REGISTRO"
          } >> "$GITHUB_STEP_SUMMARY"
