name: CI · trilha_web

# App web (Flutter web). Filtrado pela pasta: so roda quando o front web muda.
# O build de release so e gerado em push na main.

on:
  push:
    branches: [main, dev]
    paths:
      - 'trilha_web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'trilha_web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: trilha_web

jobs:
  analyze-test:
    name: Analyze e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  build-web:
    name: Build web (artefato)
    needs: analyze-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      # Path relativo a raiz do repo: o working-directory so vale para 'run'.
      - name: Publica o build web como artefato
        uses: actions/upload-artifact@v4
        with:
          name: trilha-web-release
          path: trilha_web/build/web
          retention-days: 14
