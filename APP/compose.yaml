services:
  postgres:
    image: 'postgres:16'
    environment:
      # Banco compartilhado com o Cadastro (ele e o dono da tabela 'usuario';
      # aqui ela e lida como view read-only).
      - 'POSTGRES_DB=trisha'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
