name: trilha_web
description: "Front web (desktop) do Trisha."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  provider: ^6.1.5+1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  image_picker: ^1.2.2
  stomp_dart_client: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    # Wordmark da marca. Peso unico e ja inclinada de fabrica: nunca pedir
    # bold ou italic, senao o Flutter sintetiza e deforma o desenho.
    - family: Yellowtail
      fonts:
        - asset: assets/fonts/Yellowtail-Regular.ttf
