<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trisha — rede social de trilhas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trisha">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trisha</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Fundo preto ja no carregamento, antes do Flutter subir (evita flash branco). */
    html, body { background-color: #000000; margin: 0; }

    /* Tela de boot: sem ela o carregamento (lento em debug) parece a tela travada. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: Georgia, 'Times New Roman', serif; font-style: italic;
      font-weight: 700; font-size: 26px; color: #ffffff;
    }
    #boot .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18); border-top-color: #4CAF7D;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    Trisha
    <div class="spinner"></div>
  </div>
  <script>
    // Remove a tela de boot assim que o Flutter anexa a view (primeiro frame).
    new MutationObserver(function (_, observer) {
      if (document.querySelector('flutter-view')) {
        var boot = document.getElementById('boot');
        if (boot) { boot.remove(); }
        observer.disconnect();
      }
    }).observe(document.body, { childList: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
